services:
  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: debateai_postgres
    environment:
      POSTGRES_DB: debateai_dev
      POSTGRES_USER: debateai
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debateai -d debateai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — Cache, Pub/Sub, Celery broker
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: debateai_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # API Gateway — Go (Echo)
  # ============================================================
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: debateai_api_gateway
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://debateai:secret@postgres:5432/debateai_dev?sslmode=disable
      REDIS_URL: redis://redis:6379
      DEBATE_ENGINE_ADDR: debate-engine:50051
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      debate-engine:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Debate Engine — Python (gRPC Server)
  # ============================================================
  debate-engine:
    build:
      context: ./apps/debate-engine
      dockerfile: Dockerfile
    container_name: debateai_debate_engine
    ports:
      - "50051:50051"   # gRPC port (internal)
    environment:
      APP_ENV: development
      GRPC_PORT: "50051"
      DATABASE_URL: postgres+asyncpg://debateai:secret@postgres:5432/debateai_dev
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EMBEDDING_MODEL: gemini
      EMBEDDING_DIMENSION: "768"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Celery Worker — Background KB ingestion
  # ============================================================
  celery-worker:
    build:
      context: ./apps/debate-engine
      dockerfile: Dockerfile
    container_name: debateai_celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgres+asyncpg://debateai:secret@postgres:5432/debateai_dev
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Admin Panel — Next.js
  # ============================================================
  admin-panel:
    build:
      context: ./apps/admin-panel
      dockerfile: Dockerfile
    container_name: debateai_admin
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8080/v1
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me}
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
